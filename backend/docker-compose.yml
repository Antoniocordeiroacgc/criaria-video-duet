version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - redis
      - db
    restart: unless-stopped

  worker:
    build: .
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    depends_on:
      - redis
      - db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G  # FFmpeg consome memória/CPU; limite evita um job derrubar a máquina

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API S3-compatible
      - "9001:9001"   # Console web (interface visual)
    environment:
      MINIO_ROOT_USER: criaria
      MINIO_ROOT_PASSWORD: criaria123
    volumes:
      - miniodata:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: criaria
      POSTGRES_PASSWORD: criaria
      POSTGRES_DB: criaria_duet
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
